<script>
try { localStorage.removeItem('collapse-tests:acme/widget-service/42'); } catch (e) {}
window.clickLog = {};
window.navLog = 0;
window.folderLog = 0;
window.harnessClick = false;
document.addEventListener('DOMContentLoaded', () => {});

function makeDiff(id, path) {
  const wrap = document.createElement('div');
  wrap.className = 'PullRequestDiffsList-module__diffEntry__djnVa';
  wrap.innerHTML =
    '<div role="region" id="diff-' + id + '" class="Diff-module__diff__rx9XH">' +
      '<div class="Diff-module__diffHeaderWrapper__UgUyv" data-diff-header-wrapper="true">' +
        '<div class="DiffFileHeader-module__diff-file-header__UuNN4">' +
          '<div class="d-flex flex-shrink-0">' +
            '<button data-component="IconButton" type="button" class="prc-Button-IconButton-fyge7" data-collapse="1">' +
              '<svg data-component="Octicon" class="octicon octicon-chevron-down" viewBox="0 0 16 16" width="16" height="16"><path d="M12.78 5.22Z"></path></svg>' +
            '</button>' +
          '</div>' +
          '<a class="mx-1"><svg class="octicon octicon-shield-lock"></svg></a>' +
          '<div class="DiffFileHeader-module__file-path-section__ZcmB1">' +
            '<h3 class="DiffFileHeader-module__file-name__VVXpg"><a class="Link--primary" href="#diff-' + id + '"><code>' + path + '</code></a></h3>' +
            '<button type="button" class="prc-Button-IconButton-fyge7"><svg class="octicon octicon-copy"></svg></button>' +
            '<button type="button" class="js-expand-all-difflines-button"><svg class="octicon octicon-unfold"></svg></button>' +
          '</div>' +
          '<div class="d-flex flex-items-center gap-2">' +
            '<button type="button" aria-pressed="false" aria-label="Not Viewed"><span>Viewed</span></button>' +
            '<button type="button"><svg class="octicon octicon-kebab-horizontal"></svg></button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="body"><table><tbody><tr><td>' +
        '<button class="Button--iconOnly" aria-label="Expand file up from line 93"><svg class="octicon octicon-fold-up"></svg></button>' +
        '<button class="Button--iconOnly" aria-label="Expand file down"><svg class="octicon octicon-fold-down"></svg></button>' +
      '</td></tr></tbody></table></div>' +
    '</div>';

  const row = document.createElement('li');
  row.id = 'file-tree-item-diff-' + id;
  row.className = 'ActionList-item ActionList-item--subItem js-tree-node';
  row.setAttribute('role', 'treeitem');
  row.setAttribute('aria-level', '3');
  row.innerHTML =
    '<a class="ActionList-content hx_ActionList-content" href="#diff-' + id + '" data-turbo="false" tabindex="-1">' +
      '<span class="ActionList-item-visual ActionList-item-visual--leading"><svg class="octicon octicon-file"></svg></span>' +
      '<span class="ActionList-item-label ActionList-item-label--truncate">' + path.split('/').pop() + '</span>' +
    '</a>';
  row.querySelector('a').addEventListener('click', (e) => { e.preventDefault(); window.navLog++; });
  document.getElementById('filetree').appendChild(row);

  const btn = wrap.querySelector('button[data-collapse]');
  const body = wrap.querySelector('.body');
  window.clickLog[path] = 0;
  btn.addEventListener('click', () => {
    if (!window.harnessClick) window.clickLog[path]++;
    const svg = btn.querySelector('svg');
    const collapsed = svg.classList.contains('octicon-chevron-right');
    svg.classList.toggle('octicon-chevron-right', !collapsed);
    svg.classList.toggle('octicon-chevron-down', collapsed);
    body.style.display = collapsed ? '' : 'none';
  });
  return wrap;
}

document.getElementById('filetree').addEventListener('click', () => { window.folderLog++; });
const list = document.getElementById('difflist');
list.appendChild(makeDiff('a1', 'src/Manager/ReportManager.test.ts'));
list.appendChild(makeDiff('a2', 'src/Repository/ReportRepository.ts'));
list.appendChild(makeDiff('a3', 'src/Controller/ExportController.test.ts'));
list.appendChild(makeDiff('a5', 'test/helpers/setup.ts'));
list.appendChild(makeDiff('a6', 'src/Billing.spec.ts'));
list.appendChild(makeDiff('a7', 'src/latest/Contest.ts'));
window.__MENU_HTML__ = document.querySelector('[data-component="ActionMenu.Overlay"]').outerHTML;
</script>

<script src="/content.js"></script>

<script>
const out = [];
window.__OUT__ = out;
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const item = () => document.getElementById('tem-tests-filter');
const state = (path) => {
  const h = [...document.querySelectorAll('div[role="region"][id^="diff-"]')]
    .find(r => (r.querySelector('h3 a code') || {}).textContent === path);
  if (!h) return 'ABSENT';
  const b = h.querySelector('button[data-collapse]');
  return b.querySelector('svg.octicon-chevron-down') ? 'expanded' : 'collapsed';
};
const diffHeader = (path) => {
  const region = [...document.querySelectorAll('div[role="region"][id^="diff-"]')]
    .find(r => r.querySelector('h3 a code')?.textContent === path);
  return region && region.querySelector('[data-diff-header-wrapper="true"]');
};
const headerMuted = (path) => {
  const h = diffHeader(path);
  return h ? h.classList.contains('collapse-tests-muted') : 'EN-TETE ABSENT';
};
const treeRow = (path) => [...document.querySelectorAll('#filetree [role="treeitem"]')]
  .find(li => li.querySelector('.ActionList-item-label')?.textContent.trim() === path.split('/').pop());
const treeMuted = (path) => {
  const r = treeRow(path);
  return r ? r.classList.contains('collapse-tests-muted') : 'LIGNE ABSENTE';
};
const harnessClick = (el) => {
  window.harnessClick = true;
  try { el.click(); } finally { window.harnessClick = false; }
};
const check = (name, actual, expected) => {
  out.push((String(actual) === String(expected) ? 'PASS' : 'FAIL') + ' | ' + name + ' | attendu=' + expected + ' obtenu=' + actual);
};

const A = 'src/Manager/ReportManager.test.ts';
const B = 'src/Repository/ReportRepository.ts';
const C = 'src/Controller/ExportController.test.ts';
const D = 'src/Jobs/SyncJob.test.ts';

(async () => {
  await wait(500);

  check('item injecte', !!item(), true);
  check('item dans le groupe More', item() && item().parentElement.getAttribute('aria-label'), 'More');
  check('libelle', item() && item().querySelector('[data-component="ActionList.Item.Label"]').textContent, 'Tests');
  check('coche par defaut', item() && item().getAttribute('aria-checked'), 'true');
  check('checkmark visible', item() && item().querySelector('[data-component="ActionList.Selection"] svg').style.display, 'inline-block');
  check('compteur initial', item() && item().querySelector('[data-component="CounterLabel"]').textContent, '2');
  check('pas de doublon d id dans le document', document.querySelectorAll('#tem-tests-filter').length, 1);
  check('ids du modele nettoyes', document.querySelectorAll('[id="_r_3rr_--label"]').length, 1);
  check('raccourci clavier retire', item() && item().hasAttribute('aria-keyshortcuts'), false);
  check('arborescence: rien de grise quand coche', document.querySelectorAll('.collapse-tests-muted').length, 0);
  check('en-tete de diff: rien de grise quand coche', headerMuted(A), false);
  check('aucun repli au demarrage', state(A) + '/' + state(B) + '/' + state(C), 'expanded/expanded/expanded');

  // regression: le script ne doit pas reecrire le menu a chaque tick (auto-rearmement du MutationObserver)
  let menuMutations = 0;
  const menuEl = document.querySelector('ul[role="menu"]');
  const mo = new MutationObserver((recs) => { menuMutations += recs.length; });
  mo.observe(menuEl, { childList: true, subtree: true, attributes: true, characterData: true });
  await wait(1500);
  mo.disconnect();
  check('aucune mutation parasite du menu au repos', menuMutations, 0);

  // repli manuel d un fichier de test alors que le filtre est coche: ne doit pas etre force
  document.querySelectorAll('button[data-collapse]')[0].click();
  await wait(900);
  check('repli manuel respecte quand coche', state(A), 'collapsed');
  document.querySelectorAll('button[data-collapse]')[0].click();
  await wait(400);

  // decoche
  item().click();
  await wait(900);
  check('decoche apres clic', item().getAttribute('aria-checked'), 'false');
  check('checkmark masquee', item().querySelector('[data-component="ActionList.Selection"] svg').style.display, 'none');
  check('test A replie', state(A), 'collapsed');
  check('test C replie', state(C), 'collapsed');
  check('non-test B intact', state(B), 'expanded');
  check('arborescence: test A grise', treeMuted(A), true);
  check('arborescence: test C grise', treeMuted(C), true);
  check('arborescence: non-test B intact', treeMuted(B), false);
  check('arborescence: aria-disabled pose', treeRow(A).getAttribute('aria-disabled'), 'true');
  const labelA = treeRow(A).querySelector('.ActionList-item-label');
  const labelB = treeRow(B).querySelector('.ActionList-item-label');
  check('le texte est grise malgre un !important de la page',
    getComputedStyle(labelA).color !== getComputedStyle(labelB).color, true);
  check('le texte n a pas garde la couleur imposee par la page',
    getComputedStyle(labelA).color !== 'rgb(240, 246, 252)', true);
  check('la couleur est bien posee en inline important',
    labelA.style.getPropertyPriority('color'), 'important');
  check('le curseur passe a not-allowed malgre un !important de la page',
    getComputedStyle(treeRow(A).querySelector('a')).cursor, 'not-allowed');
  check('curseur inchange sur un non-test',
    getComputedStyle(treeRow(B).querySelector('a')).cursor, 'pointer');
  check('en-tete de diff: curseur not-allowed',
    getComputedStyle(diffHeader(A).querySelector('button[data-collapse]')).cursor, 'not-allowed');

  check('en-tete de diff: test A grise', headerMuted(A), true);
  check('en-tete de diff: test C grise', headerMuted(C), true);
  check('en-tete de diff: non-test B intact', headerMuted(B), false);
  check('en-tete de diff: texte en gris inline',
    diffHeader(A).querySelector('h3 a code').style.getPropertyPriority('color'), 'important');

  const chevronBefore = state(A);
  diffHeader(A).querySelector('button[data-collapse]').click();
  check('chevron inerte sur un en-tete grise', state(A), chevronBefore);
  check('le fichier est reste replie', state(A), 'collapsed');
  harnessClick(diffHeader(B).querySelector('button[data-collapse]'));
  check('chevron toujours actif sur un non-test', window.navLog >= 0, true);
  harnessClick(diffHeader(B).querySelector('button[data-collapse]'));

  check('pointer-events reste actif (sinon le clic traverse vers le dossier)',
    getComputedStyle(treeRow(A)).pointerEvents, 'auto');
  if (innerWidth > 0 && innerHeight > 0) {
    const box = treeRow(A).getBoundingClientRect();
    const hit = document.elementFromPoint(box.left + box.width / 2, box.top + box.height / 2);
    check('la ligne grisee reste la cible du pointeur', !!hit && !!hit.closest('.collapse-tests-muted'), true);
  } else {
    out.push('INFO | test de survol saute: viewport a zero dans ce navigateur');
  }

  const folderBefore = window.folderLog;
  treeRow(A).querySelector('a').click();
  check('le clic ne remonte pas au conteneur parent', window.folderLog, folderBefore);
  treeRow(A).dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true }));
  check('mousedown bloque aussi', window.folderLog, folderBefore);
  const titreGrisePar = document.querySelector('#diff-a1 h3 a').closest('.collapse-tests-muted');
  check('le lien du titre de fichier est grise par l en-tete, pas pris pour une ligne d arbre',
    titreGrisePar ? titreGrisePar.hasAttribute('data-diff-header-wrapper') : 'AUCUN ANCETRE GRISE', true);

  const navBefore = window.navLog;
  treeRow(A).querySelector('a').click();
  check('clic bloque sur une ligne grisee', window.navLog, navBefore);
  treeRow(B).querySelector('a').click();
  check('clic toujours actif sur un non-test', window.navLog, navBefore + 1);

  const kev = new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true });
  treeRow(A).querySelector('a').dispatchEvent(kev);
  check('Entree bloquee sur une ligne grisee', kev.defaultPrevented, true);

  let treeMutations = 0;
  const treeObs = new MutationObserver((recs) => { treeMutations += recs.length; });
  treeObs.observe(document.getElementById('filetree'), { childList: true, subtree: true, attributes: true });
  await wait(1500);
  treeObs.disconnect();
  check('arborescence: aucune mutation parasite au repos', treeMutations, 0);

  check('etat persiste', localStorage.getItem('collapse-tests:acme/widget-service/42'), '0');

  // fichier arrive plus tard (scroll / lazy load)
  document.getElementById('difflist').appendChild(makeDiff('a4', D));
  await wait(1200);
  check('nouveau fichier de test replie', state(D), 'collapsed');
  check('compteur mis a jour', item().querySelector('[data-component="CounterLabel"]').textContent, '3');

  // le menu est detruit puis recree a chaque ouverture (React)
  document.querySelector('[data-component="ActionMenu.Overlay"]').remove();
  check('item disparu avec le menu', !!item(), false);
  document.body.insertAdjacentHTML('afterbegin', window.__MENU_HTML__);
  await wait(900);
  check('item reinjecte apres re-rendu du menu', !!item(), true);
  check('etat decoche conserve apres re-rendu', item() && item().getAttribute('aria-checked'), 'false');
  check('un seul item apres re-rendu', document.querySelectorAll('#tem-tests-filter').length, 1);

  // recoche
  item().click();
  await wait(1200);
  check('recoche', item().getAttribute('aria-checked'), 'true');
  check('test A redeplie', state(A), 'expanded');
  check('test C redeplie', state(C), 'expanded');
  check('test D redeplie', state(D), 'expanded');
  check('non-test B toujours intact', state(B), 'expanded');
  check('arborescence: plus rien de grise apres recoche', document.querySelectorAll('.collapse-tests-muted').length, 0);
  check('arborescence: aria-disabled retire', treeRow(A).hasAttribute('aria-disabled'), false);
  check('la couleur inline est retiree', treeRow(A).querySelector('.ActionList-item-label').style.color, '');
  check('le curseur inline est retire', getComputedStyle(treeRow(A).querySelector('a')).cursor, 'pointer');
  check('en-tete de diff: plus grise apres recoche', headerMuted(A), false);
  harnessClick(diffHeader(A).querySelector('button[data-collapse]'));
  check('chevron redevenu actif apres recoche', state(A), 'collapsed');
  harnessClick(diffHeader(A).querySelector('button[data-collapse]'));
  await wait(400);
  check('le marqueur interne est retire', document.querySelectorAll('[data-ct-grey]').length, 0);
  const navAfter = window.navLog;
  treeRow(A).querySelector('a').click();
  check('clic redevenu actif sur un test', window.navLog, navAfter + 1);

  check('cle localStorage nettoyee', localStorage.getItem('collapse-tests:acme/widget-service/42'), 'null');

  // faux positifs
  check('dossier test/ non replie', state('test/helpers/setup.ts'), 'expanded');
  check('.spec non replie', state('src/Billing.spec.ts'), 'expanded');
  check('Contest.ts non replie', state('src/latest/Contest.ts'), 'expanded');
  check('aucun clic sur les faux positifs',
    window.clickLog['test/helpers/setup.ts'] + window.clickLog['src/Billing.spec.ts'] + window.clickLog['src/latest/Contest.ts'], 0);

  // stabilite: pas de boucle de clics
  await wait(2500);
  check('etat stable apres repos', state(A) + '/' + state(C) + '/' + state(D), 'expanded/expanded/expanded');
  const maxClicks = Math.max(...Object.values(window.clickLog));
  check('pas de boucle de clic (max par fichier <= 6)', maxClicks <= 6, true);
  out.push('INFO | clics par fichier: ' + JSON.stringify(window.clickLog));
  out.push('INFO | jamais clique sur B: ' + (window.clickLog[B] === 0));

  // storage bloque (navigation privee, cookies tiers coupes)
  const realSet = Storage.prototype.setItem;
  const realGet = Storage.prototype.getItem;
  Storage.prototype.setItem = function () { throw new DOMException('blocked', 'SecurityError'); };
  Storage.prototype.getItem = function () { throw new DOMException('blocked', 'SecurityError'); };
  let threw = false;
  try { item().click(); await wait(1200); } catch (e) { threw = true; }
  check('storage bloque: pas d exception', threw, false);
  check('storage bloque: le filtre replie quand meme', state(A), 'collapsed');
  Storage.prototype.setItem = realSet;
  Storage.prototype.getItem = realGet;
  localStorage.removeItem('collapse-tests:acme/widget-service/42');
  await wait(1200);

  // perf sur un gros diff
  const list2 = document.getElementById('difflist');
  for (let i = 0; i < 300; i++) {
    list2.appendChild(makeDiff('p' + i, 'src/gen/File' + i + (i % 3 === 0 ? '.test' : '') + '.ts'));
  }
  await wait(2000);
  check('gros diff: compteur', item().querySelector('[data-component="CounterLabel"]').textContent, '103');
  const t0 = performance.now();
  const ROUNDS = 20;
  for (let k = 0; k < ROUNDS; k++) {
    for (const r of document.querySelectorAll('div[role="region"][id^="diff-"]')) {
      const n = r.querySelector('h3 a code') || r.querySelector('h3 a');
      const path = n ? n.textContent.trim() : '';
      if (!path || !path.toLowerCase().includes('.test')) continue;
      r.querySelector('button:has(> svg.octicon-chevron-down), button:has(> svg.octicon-chevron-right)');
    }
  }
  const perTick = (performance.now() - t0) / ROUNDS;
  out.push('INFO | cout d un scan sur 303 fichiers: ' + perTick.toFixed(2) + ' ms');
  check('scan sous 50 ms', perTick < 50, true);

  check('le banc se termine sur un etat propre',
    localStorage.getItem('collapse-tests:acme/widget-service/42'), 'null');

  const payload = 'BEGIN\n' + out.join('\n') + '\nEND';
  document.getElementById('results').textContent = payload;
  window.__RESULTS__ = payload;
})();
</script>
